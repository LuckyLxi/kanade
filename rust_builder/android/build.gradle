// The Android Gradle Plugin builds the native code with the Android NDK.
// AGP 由宿主工程（android/settings.gradle.kts）提供，这里不再单独声明 buildscript 版本，
// 否则会和 Flutter 3.47 默认的 AGP 9 冲突。

group 'com.flutter_rust_bridge.rust_lib_kanade'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace 'com.flutter_rust_bridge.rust_lib_kanade'
    compileSdk 36

    // Use the NDK version declared in /android/app/build.gradle.kts of the Flutter project.
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 21
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../rust"
    libname = "rust_lib_kanade"
}
